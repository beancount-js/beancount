name: CI

on:
  pull_request:
  push:
    branches:
      - beancount-studio
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  specification:
    name: Specification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.4"

      - name: Install Jujutsu for catalog provenance
        env:
          JJ_VERSION: "0.45.1"
          JJ_SHA256: f35438350b5d61963aac5dd74ede510b31d6b9690769d1a6268cf058cc825f72
        run: |
          archive="${RUNNER_TEMP}/jj.tar.gz"
          directory="$(mktemp -d "${RUNNER_TEMP}/jj.XXXXXX")"
          curl --fail --silent --show-error --location \
            "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "${archive}"
          echo "${JJ_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${directory}"
          echo "${directory}" >> "${GITHUB_PATH}"
          "${directory}/jj" version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check specifications
        run: pnpm spec:check

  application:
    name: Application
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Jujutsu for catalog provenance
        env:
          JJ_VERSION: "0.45.1"
          JJ_SHA256: f35438350b5d61963aac5dd74ede510b31d6b9690769d1a6268cf058cc825f72
        run: |
          archive="${RUNNER_TEMP}/jj.tar.gz"
          directory="$(mktemp -d "${RUNNER_TEMP}/jj.XXXXXX")"
          curl --fail --silent --show-error --location \
            "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "${archive}"
          echo "${JJ_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${directory}"
          echo "${directory}" >> "${GITHUB_PATH}"
          "${directory}/jj" version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @beancount-js/ui exec playwright install --with-deps chromium

      - name: Check the application
        run: pnpm checks:functional

      - name: Test the complete workspace
        run: pnpm test
