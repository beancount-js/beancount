name: CI

on:
  pull_request:
  push:
    branches:
      - beancount-studio
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  specification:
    name: Specification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.4"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check specifications
        run: pnpm spec:check

  application:
    name: Application
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @beancount-js/ui exec playwright install --with-deps chromium

      - name: Check the application
        run: pnpm checks:functional

      - name: Test the complete workspace
        run: pnpm test
